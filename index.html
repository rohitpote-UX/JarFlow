<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/icons/icon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    
    <!-- PWA Settings -->
    <meta name="theme-color" content="#1E40AF" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="JarFlow" />
    <link rel="apple-touch-icon" href="/icons/icon.svg" />
    <link rel="manifest" href="/manifest.json" />

    <title>JarFlow - Mobile Water Jar Management PWA</title>
    <meta name="description" content="Ultra-fast, mobile-first Jar Management PWA for water distribution businesses. Track given, returned, cash, and udhari with zero friction." />

    <!-- Google Fonts: Plus Jakarta Sans & Noto Sans Devanagari for clean English & authentic Marathi typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Devanagari:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  </head>
  <body class="bg-[#FAFAFA] text-[#111827] antialiased selection:bg-blue-100 selection:text-blue-900 select-none touch-manipulation">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Register Service Worker for PWA
      if ('serviceWorker' in navigator && window.location.protocol.startsWith('http')) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then(reg => {
              console.log('JarFlow ServiceWorker registered successfully: ', reg.scope);
            })
            .catch(err => {
              console.log('JarFlow ServiceWorker registration failed: ', err);
            });
        });
      }
    </script>
  </body>
</html>
