<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#1E40AF" />
    </linearGradient>
    <linearGradient id="waterGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#60A5FA" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#1E40AF" flood-opacity="0.3" />
    </filter>
  </defs>
  
  <!-- Background with rounded corners -->
  <rect width="512" height="512" rx="112" fill="url(#primaryGrad)" />
  
  <!-- Subtle circular backdrop -->
  <circle cx="256" cy="256" r="180" fill="#ffffff" fill-opacity="0.08" />
  
  <!-- Premium 20L Water Jar Silhouette -->
  <g filter="url(#shadow)" transform="translate(0, 10)">
    <!-- Jar Neck Ring -->
    <rect x="220" y="110" width="72" height="28" rx="8" fill="#FFFFFF" />
    <!-- Jar Collar -->
    <path d="M210 138 H302 L320 180 H192 Z" fill="#FFFFFF" />
    <!-- Jar Main Body -->
    <path d="M176 195 
             C176 185 184 180 194 180 
             H318 
             C328 180 336 185 336 195 
             L352 355 
             C354 380 334 402 308 402 
             H204 
             C178 402 158 380 160 355 
             Z" 
          fill="#FFFFFF" />
          
    <!-- Water Level Inside Jar -->
    <path d="M182 250 
             C210 240 240 256 270 248 
             C300 240 325 248 332 252 
             L344 355 
             C345 372 331 386 312 386 
             H200 
             C181 386 167 372 168 355 
             Z" 
          fill="url(#waterGrad)" />
          
    <!-- Water Drop Badge at Center -->
    <circle cx="256" cy="300" r="32" fill="#FFFFFF" />
    <path d="M256 276 C256 276 272 296 272 306 C272 315 264.8 322 256 322 C247.2 322 240 315 240 306 C240 296 256 276 256 276 Z" fill="#2563EB" />
    
    <!-- Grip lines / Jar rings -->
    <line x1="172" y1="220" x2="340" y2="220" stroke="#DBEAFE" stroke-width="4" stroke-linecap="round" />
    <line x1="168" y1="285" x2="344" y2="285" stroke="#93C5FD" stroke-width="3" stroke-linecap="round" stroke-opacity="0.6" />
    <line x1="166" y1="340" x2="346" y2="340" stroke="#60A5FA" stroke-width="3" stroke-linecap="round" stroke-opacity="0.6" />
  </g>
</svg>
